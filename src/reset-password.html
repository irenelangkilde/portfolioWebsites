<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" type="image/png" href="/assets/images/favicon.png" />
<title>Set a new password — Irene's Webworks</title>

<!--
  A password-reset link always opens a NEW browser tab; the mail client decides that and
  no page can override it. Reset links used to point at overview.html, which IS the intake
  form — so a user part-way through the form got a second, empty copy of it in front of
  them and their answers appeared to be gone. (They were not: the original tab still held
  them, but nothing said so.)

  This page exists so the new tab is obviously not the form. It sets the password, then
  writes the localStorage key that overview.html listens for, so the tab the user was
  actually working in signs itself in and keeps every field intact.
-->

<script src="/src/siteConfig.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0b1220; --panel:rgba(255,255,255,.06); --border:rgba(255,255,255,.14);
    --text:#eaf0ff; --muted:rgba(234,240,255,.72); --accent:#8DE0FF; --primary:#4E70F1;
    --ok:#76b022; --danger:#FBAB9C; --radius:14px;
    --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:var(--font); color:var(--text); min-height:100vh; line-height:1.6;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(900px 520px at 15% 0%, color-mix(in oklab, var(--primary) 22%, transparent), transparent 60%),
      radial-gradient(900px 520px at 85% 0%, color-mix(in oklab, var(--danger) 18%, transparent), transparent 60%),
      var(--bg);
  }
  .card{
    width:min(440px,100%); background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:28px; box-shadow:0 10px 26px rgba(0,0,0,.35);
  }
  h1{ font-size:20px; font-weight:900; margin-bottom:6px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:20px; }
  label{ display:block; font-size:13px; font-weight:700; margin:14px 0 6px; }
  input{
    width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--border);
    background:rgba(0,0,0,.25); color:var(--text); font-size:14px; font-family:inherit;
  }
  button{
    width:100%; margin-top:18px; padding:12px 16px; border-radius:12px; border:0;
    background:color-mix(in oklab, var(--primary) 55%, rgba(255,255,255,.08));
    color:var(--text); font-weight:800; font-size:15px; cursor:pointer; font-family:inherit;
  }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .msg{ margin-top:14px; font-size:13.5px; line-height:1.55; }
  .msg.err{ color:var(--danger); }
  .msg.ok{ color:var(--ok); }
  .hint{ margin-top:18px; padding-top:16px; border-top:1px solid var(--border);
         color:var(--muted); font-size:13px; }
  a{ color:var(--accent); }
  [hidden]{ display:none !important; }

    /* Chrome/Safari paint their own background on autofilled fields and ignore
       background-color, turning them white on a dark form. The inset shadow covers the
       settled state; the long transition covers the un-targetable preview state. */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active,
    textarea:-webkit-autofill,
    select:-webkit-autofill {
      -webkit-box-shadow: 0 0 0px 1000px #39404f inset !important;
      box-shadow: 0 0 0px 1000px #39404f inset !important;
      -webkit-text-fill-color: #eaf0ff;
      caret-color: #eaf0ff;
      transition: background-color 600000s 0s, color 600000s 0s;
    }
</style>
</head>
<body>
  <main class="card">
    <h1>Set a new password</h1>
    <p class="sub" id="sub">Choose a new password for your account.</p>

    <form id="form">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" required />
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required />
      <button id="submit" type="submit">Save password</button>
    </form>

    <p class="msg" id="msg"></p>

    <p class="hint" id="hint" hidden>
      You can close this tab and return to the one you were working in — it will be signed
      in already.
    </p>
    <p class="hint" id="backLink" hidden>
      <a href="/src/overview.html">Go to the portfolio builder →</a>
    </p>
  </main>

<script>
  const SUPABASE_URL      = "https://ssnjjojacxalnwpbzprx.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_0vuLGHGt-cvTr6UZKY4Jdw_r5768KtY";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Must match overview.html — that page listens for this key to clear its own stale
  // sign-in dialog and adopt the new session.
  const PASSWORD_RESET_PING_KEY = "iw-password-reset-complete";

  const form   = document.getElementById("form");
  const msgEl  = document.getElementById("msg");
  const subEl  = document.getElementById("sub");
  const btn    = document.getElementById("submit");
  const hintEl = document.getElementById("hint");
  const backEl = document.getElementById("backLink");

  function say(text, kind) {
    msgEl.textContent = text;
    msgEl.className = "msg" + (kind ? " " + kind : "");
  }

  // Supabase reports a rejected link in the URL FRAGMENT, e.g.
  //   #error=access_denied&error_code=otp_expired&error_description=Email+link+is+invalid...
  // Read it before showing the form: asking for a password that cannot be saved is worse
  // than saying plainly that the link is dead.
  const hash    = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  const errCode = hash.get("error_code") || hash.get("error") || "";
  const errText = (hash.get("error_description") || "").replace(/\+/g, " ");

  if (errCode) {
    form.hidden = true;
    subEl.textContent = "";
    // otp_expired covers both "expired" and "already used" — Supabase does not
    // distinguish, and single-use tokens in a plain GET URL are routinely spent by mail
    // scanners prefetching the link before the recipient clicks it.
    say(/expired|invalid/i.test(errCode + " " + errText)
      ? "This reset link is no longer valid. Links expire, and can only be used once — request a new one from the sign-in dialog."
      : (errText || "This reset link could not be used. Request a new one from the sign-in dialog."), "err");
    backEl.hidden = false;
    console.warn("[reset] link rejected:", errCode, errText);
  } else {
    // The session arrives asynchronously from the URL. Saving needs it, so check before
    // letting the user type a password into a form that cannot submit.
    setTimeout(async () => {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session?.user) {
        form.hidden = true;
        subEl.textContent = "";
        say("This reset link is no longer valid, or was opened on a different site address than the one it was requested from. Request a new one from the sign-in dialog.", "err");
        backEl.hidden = false;
      }
    }, 3000);
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    const pw  = document.getElementById("pw").value;
    const pw2 = document.getElementById("pw2").value;

    if (pw.length < 8)  return say("Password must be at least 8 characters.", "err");
    if (pw !== pw2)     return say("Passwords don't match.", "err");

    btn.disabled = true;
    btn.textContent = "Saving…";
    const { error } = await _supabase.auth.updateUser({ password: pw });
    btn.disabled = false;
    btn.textContent = "Save password";

    if (error) return say(error.message, "err");

    form.hidden = true;
    subEl.textContent = "";
    say("Password updated — you are signed in.", "ok");
    hintEl.hidden = false;
    backEl.hidden = false;

    // Tell the tab the user was actually working in. The `storage` event fires only in
    // OTHER tabs of this origin, never the one that wrote it, which is exactly right —
    // that tab adopts the session and clears its stale "reset email sent" dialog without
    // losing any form input.
    try { localStorage.setItem(PASSWORD_RESET_PING_KEY, String(Date.now())); }
    catch { /* private mode or quota — the other tab simply stays as it was */ }
  });
</script>
</body>
</html>
