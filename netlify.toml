[build]
  # Netlify's Ruby buildpack only auto-runs `bundle install` when it finds a
  # Gemfile at the repo root. Our Gemfile lives in blog/, so we have to run
  # `bundle install` ourselves before invoking jekyll — otherwise the build
  # fails with "bundler: command not found: jekyll".
  command = "cd blog && bundle install && bundle exec jekyll build --destination ../blog-built"
  publish = "."
  functions = "src/netlify/functions"
  edge_functions = "netlify/edge-functions"

# Serve the Jekyll-built blog under /blog/
[[redirects]]
  from = "/blog/*"
  to = "/blog-built/:splat"
  status = 200
  force = true

[functions]
  node_bundler = "esbuild"
  directory = "src/netlify/functions"
  included_files = ["src/*.txt", "src/netlify/functions/*.md", "*.md", "templates/**"]
  external_node_modules = ["@anthropic-ai/sdk", "openai", "@supabase/supabase-js", "stripe", "playwright", "playwright-core", "chromium-bidi", "sharp"]

# Edge function handles custom domain → portfolio routing
[[edge_functions]]
  function = "servePortfolio"
  path = "/*"

# Clean URLs for published portfolios
# /u/janesmith       → latest version
# /u/janesmith-1     → permanent deploy #1 snapshot
[[redirects]]
  from = "/u/:slug"
  to = "/.netlify/functions/publishedPortfolio?slug=:slug"
  status = 200




# Nightly reconciliation of published sites against paid hosting.
#
# Delisting is what this exists for and is reversible — a lapsed site stops being served
# and everything stays stored, so renewing brings it back on the next run.
#
# Deletion (18 months after hosting lapses) is OFF unless HOSTING_DELETE_ENABLED is set to
# the string "true". Left unset, the job logs what it would delete and deletes nothing.
# It is the only destructive operation in the system, so it stays opt-in.
[functions."reconcileHosting"]
  schedule = "0 4 * * *"

# Pre-expiry renewal reminders, an hour after the reconcile job so the two never
# contend for the same rows. Sends at most one email per expiry date, and skips
# auto-renewing subscribers because Stripe already warns them.
[functions."sendRenewalReminders"]
  schedule = "0 5 * * *"
