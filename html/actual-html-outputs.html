<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actual HTML Outputs</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-deep: #16213e;
      --panel: rgba(24, 34, 62, 0.86);
      --panel-strong: #213055;
      --ink: #eef3ff;
      --muted: #aab6d3;
      --line: rgba(255, 255, 255, 0.1);
      --shadow: 0 18px 50px rgba(5, 10, 24, 0.34);
      --shadow-strong: 0 24px 60px rgba(5, 10, 24, 0.5);
      --accent: #8ea2ff;
      --accent-2: #7ed7c1;
      --preview-width: 1440;
      --preview-height: 1024;
      --preview-scale: 0.28;
      --preview-frame-width: 357.14%;
      --preview-shell-height: calc(30px + (var(--preview-height) * 1px * var(--preview-scale)));
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Manrope", "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(142, 162, 255, 0.16), transparent 34%),
        radial-gradient(circle at top right, rgba(126, 215, 193, 0.14), transparent 28%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    a {
      color: inherit;
    }

    .page {
      width: min(1500px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    .hero {
      margin-bottom: 28px;
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(22, 33, 62, 0.88);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(1.8rem, 3.6vw, 3rem);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.03em;
      max-width: 28ch;
    }

    .hero-copy {
      display: block;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    /* Only shown when the form opened this tab, where clicks mean "pick", not "open". */
    .picker-note {
      margin: 0 0 20px;
      padding: 12px 16px;
      border: 1px solid rgba(142, 162, 255, 0.28);
      border-radius: 14px;
      background: rgba(142, 162, 255, 0.1);
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .picker-note[hidden] { display: none; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 22px;
    }

    .card {
      position: relative;
      display: grid;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      overflow: hidden;
      isolation: isolate;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: auto -10% -35% auto;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(142, 162, 255, 0.18), transparent 70%);
      z-index: -1;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-6px);
      border-color: rgba(142, 162, 255, 0.28);
      box-shadow: var(--shadow-strong);
    }

    .card:focus-visible {
      outline: 3px solid rgba(142, 162, 255, 0.22);
      outline-offset: 2px;
    }

    .preview-shell {
      position: relative;
      height: var(--preview-shell-height);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background:
        linear-gradient(180deg, rgba(126, 215, 193, 0.08), rgba(142, 162, 255, 0.08)),
        var(--panel-strong);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .preview-shell::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 30px;
      background: linear-gradient(180deg, rgba(142, 162, 255, 0.18), rgba(142, 162, 255, 0.06));
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 2;
    }

    .preview-shell::after {
      content: "";
      position: absolute;
      top: 10px;
      left: 12px;
      width: 48px;
      height: 10px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 5px 5px, #d97757 0 4px, transparent 4.1px),
        radial-gradient(circle at 24px 5px, #d7a457 0 4px, transparent 4.1px),
        radial-gradient(circle at 43px 5px, #5e9f86 0 4px, transparent 4.1px);
      z-index: 3;
    }

    .preview-stage {
      position: absolute;
      top: 30px;
      left: 0;
      width: 100%;
      height: calc(100% - 30px);
      overflow: hidden;
      background: #fff;
    }

    .preview-frame {
      width: var(--preview-frame-width);
      height: calc(var(--preview-height) * 1px);
      border: 0;
      transform: scale(var(--preview-scale));
      transform-origin: top left;
      pointer-events: none;
      background: #fff;
    }

    .preview-link {
      display: block;
      border-radius: 18px;
      text-decoration: none;
      outline: none;
    }

    /* Same box as the <a>, but as a <button> when clicking selects a style rather than
       navigating. Strip the UA button chrome so the two render identically. */
    button.preview-link {
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    .preview-link--pick:hover .preview-shell {
      border-color: rgba(126, 215, 193, 0.55);
    }

    .preview-link:focus-visible .preview-shell {
      border-color: rgba(142, 162, 255, 0.68);
      box-shadow:
        0 0 0 4px rgba(142, 162, 255, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .card-body {
      display: grid;
      gap: 10px;
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    /* The row is space-between with "Details" at the far end, so the pills are grouped —
       otherwise a second pill would be flung to the middle rather than sitting beside the
       first. The group wraps so a long "Style (Template)" plus a composition pill drops to
       a second line instead of squeezing either. */
    .card-tag-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 0 1 auto;
    }

    .card-meta-row .card-tag {
      flex: 0 1 auto;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Quieter than the style pill: this is provenance, not the card's identity. */
    .card-tag--composition {
      border-color: rgba(126, 215, 193, 0.3);
      background: rgba(126, 215, 193, 0.12);
      color: var(--accent-2);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .card h2 {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.2;
    }

    /* Card identity: one static tag reading "Style" or "Style (Template)". This replaced a
       pair of editable <select>s; the Keep checkbox that sat above them is gone too. */
    .card-tag {
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      padding: 4px 12px;
      border: 1px solid rgba(142, 162, 255, 0.28);
      border-radius: 999px;
      background: rgba(142, 162, 255, 0.14);
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.45;
      font-family: inherit;
    }

    /* Only when this page was opened from the form's Style field. */
    .card-tag--pick {
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .card-tag--pick:hover,
    .card-tag--pick:focus-visible {
      background: rgba(142, 162, 255, 0.28);
      border-color: rgba(142, 162, 255, 0.6);
      color: var(--ink);
      outline: none;
    }

    .card-tag--picked {
      background: var(--accent-2);
      border-color: var(--accent-2);
      color: #10172a;
    }

    /* Two-line tag row: a pill for the design-style token from the
       overview.html Style dropdown, and a short prose descriptor next to it. */
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 10px;
      margin: -4px 0 -2px;
    }
    .style-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(142, 162, 255, 0.16);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.5;
    }
    .style-descriptor {
      color: rgba(234, 240, 255, 0.7);
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .source-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(126, 215, 193, 0.14);
      color: var(--accent-2);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.5;
    }

    .source-tag-template {
      background: rgba(142, 162, 255, 0.16);
      color: var(--accent);
    }

    .deployed-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(126, 215, 193, 0.14);
      color: var(--accent-2);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.5;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 30px;
      padding: 3px 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--accent-2);
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      font-family: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      transition: color 0.18s ease, text-decoration-color 0.18s ease;
    }

    .cta:hover,
    .cta:focus-visible {
      color: var(--ink);
      text-decoration-color: var(--ink);
      outline: none;
    }

    .cta-link {
      text-decoration: none;
    }

    @media (max-width: 820px) {
      .page {
        width: min(100vw - 18px, 1240px);
        padding-top: 12px;
      }

      .hero {
        padding: 18px;
        border-radius: 22px;
      }
    }

    @media (max-width: 520px) {
      :root {
        --preview-scale: 0.22;
        --preview-frame-width: 454.55%;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 14px;
        border-radius: 20px;
      }

      .preview-shell {
        border-radius: 16px;
      }

      h1 {
        max-width: none;
      }
    }
  </style>

    const TEMPLATE_STYLES = {
      Alex: "Clean minimal",
      Jamie: "Classic",
      Mellissa: "Bold",
      Riley: "Editorial",
      Sarah: "Classic",
    };

    // Dropdown vocabularies. Styles mirror the Style dropdown in src/overview.html;
    // templates mirror templates/templates.json. Keep both in sync with their sources.
    const gallery = document.getElementById("gallery");

    // The card tag reads straight from `files` — the localStorage override layer that once
    // backed the editable style/template selects is gone with them.
    function entryStyle(entry) {
      return outputStyle(entry);
    }

    function entryTemplate(entry) {
      return entry.designSourceType === "template" ? (entry.designSource || "") : "";
    }

    function outputTitle(entry) {
      return entry.title || entry.file || entry.href;
    }

    function outputStyle(entry) {
      return entry.style || TEMPLATE_STYLES[entry.designSource] || entry.designSource || "Unknown";
    }

    function outputLayout(entry) {
      return entry.layout || "Unknown";
    }

    function cardLabel(entry) {
      if (entry.label) return entry.label;
      const baseLabel = `${entry.firstName || outputTitle(entry).split(/\s+/)[0]} - ${outputStyle(entry)} - ${outputLayout(entry)}`;
      return entry.designSourceType === "template" && entry.designSource
        ? `${baseLabel} - ${entry.designSource}`
        : baseLabel;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function displayPath(href) {
      try {
        return decodeURIComponent(href.replace(/^\.\.\//, ""));
      } catch (error) {
        return href.replace(/^\.\.\//, "");
      }
    }

    function copyPath(entry) {
      return displayPath(entry.href);
    }

    // For text going inside an HTML comment rather than a text node. escapeHtml() is wrong
    // here — entities are not decoded in comments, so "&amp;" would show literally. What a
    // comment actually cannot hold is "--" (and a leading ">" or "->"), so neutralize those.
    function commentSafe(value) {
      return String(value == null ? "" : value)
        .replace(/-{2,}/g, (run) => "- ".repeat(run.length).trim())
        .replace(/^[>]|^->/, " $&");
    }

      const currentStyle = entryStyle(entry);
      const currentTemplate = entryTemplate(entry);

      // Identity reads as one tag: the style, plus the source template in parentheses when
      // the output came from one. When this page was opened FROM the form's Style field, the
      // tag becomes a button that sends its style back; standalone it is plain text.
      const tagText = currentTemplate ? `${currentStyle} (${currentTemplate})` : currentStyle;

      // Second pill, only when composition says something layout does not. On 18 of 21
      // entries the two agree and repeating it would be noise; the exception is the
      // scene-based pages, whose origin is otherwise unrecoverable from the card.
      const composition = String(entry.composition || "").trim();
      const compositionPill = composition && composition !== String(entry.layout || "").trim()
        ? `<span class="card-tag card-tag--composition" title="Composition: ${escapeHtml(composition)} (hero arrangement: ${escapeHtml(entry.layout || "")})">${escapeHtml(composition)}</span>`
        : "";

      const previewInner = `
          <div class="preview-shell" aria-hidden="true">
            <div class="preview-stage">
              <iframe
                class="preview-frame"
                src="${entry.href}"
                title="${escapeHtml(label)} preview"
                loading="lazy"
                tabindex="-1"
              ></iframe>
            </div>
          </div>`;

      // In picker mode the thumbnail selects the style instead of opening the output —
      // that is the reason the form sent you here. "Details" still opens the real page,
      // so nothing becomes unreachable.
      const previewBlock = pickerOpener
        ? `<button type="button" class="preview-link preview-link--pick" title="Use ${escapeHtml(currentStyle)} on the form" aria-label="Use ${escapeHtml(currentStyle)} on the form">${previewInner}</button>`
        : `<a class="preview-link" href="${entry.href}" target="_blank" rel="noopener noreferrer" aria-label="Open ${escapeHtml(label)} website">${previewInner}</a>`;

      card.innerHTML = `
        ${previewBlock}
        <div class="card-body">
          <div class="card-meta-row">
            <div class="card-tag-group">
              ${pickerOpener
                ? `<button type="button" class="card-tag card-tag--pick" data-style="${escapeHtml(currentStyle)}" title="Use ${escapeHtml(currentStyle)} on the form">${escapeHtml(tagText)}</button>`
                : `<div class="card-tag">${escapeHtml(tagText)}</div>`}
              ${compositionPill}
            </div>
            <a class="cta cta-link" href="${entry.href}" target="_blank" rel="noopener noreferrer" aria-label="Open ${escapeHtml(label)} website">Details</a>
          </div>
          <!-- ${commentSafe(copyPath(entry))} -->
        </div>
      `;

      // Both the thumbnail and the tag send the same style. Confirmation always lands on
      // the tag: it is the card's text, and the thumbnail is an iframe we cannot write into.
      const tagButton = card.querySelector(".card-tag--pick");
      card.querySelectorAll(".preview-link--pick, .card-tag--pick").forEach((trigger) => {
        trigger.addEventListener("click", () => sendStyleToOpener(currentStyle, tagButton));
      });

      return card;
    }

    // The window that opened this tab, when there is one. Set once: if the form tab is
    // closed later, postMessage simply no-ops rather than throwing.
    const pickerOpener = (() => {
      try { return window.opener && !window.opener.closed ? window.opener : null; }
      catch (error) { return null; }   // cross-origin opener
    })();

    // Same-origin in practice; falls back to "*" under file://, where origin is "null" and
    // a targeted post would silently fail.
    const pickerTargetOrigin = /^https?:$/.test(window.location.protocol) ? window.location.origin : "*";

    function sendStyleToOpener(style, button) {
      if (!pickerOpener || !style) return;
      try {
        pickerOpener.postMessage({ type: "styleSelected", style }, pickerTargetOrigin);
      } catch (error) {
        return;
      }
      // The form tab is in the background, so confirm here rather than there.
      const previous = button.textContent;
      button.classList.add("card-tag--picked");
      button.textContent = `${style} → sent to form ✓`;
      window.setTimeout(() => {
        button.classList.remove("card-tag--picked");
        button.textContent = previous;
      }, 1600);
    }

    function renderGallery() {
      const note = document.getElementById("pickerNote");
      if (note) {
        note.hidden = !pickerOpener;
        if (pickerOpener) {
          note.textContent = "Click any thumbnail or its style tag to send that style to the form. "
            + "This tab stays open, and “Details” still opens the output itself.";
        }
      }

      const fragment = document.createDocumentFragment();

      // Alphabetical by field 1 (style), then field 2 (template), then file name so the
      // order is stable when two cards share a style. Sorted here rather than in the
      // `files` literal because the style is editable at runtime.
      const ordered = [...files].sort((a, b) =>
        entryStyle(a).localeCompare(entryStyle(b))
        || entryTemplate(a).localeCompare(entryTemplate(b))
        || String(a.file).localeCompare(String(b.file)));

      ordered.forEach((entry) => {
        fragment.appendChild(createCard(entry));
      });

      gallery.innerHTML = "";
      gallery.appendChild(fragment);
    }

    renderGallery();
  </script>
</body>
</html>
